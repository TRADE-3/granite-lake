name: granite_lake
description: "Granite Lake — Forensic-grade photo authenticity for field operations."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  camera: ^0.11.1
  cryptography: ^2.7.0
  device_info_plus: ^11.3.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  on_chain: ^8.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  geolocator: ^13.0.2
  package_info_plus: ^8.1.2
  gal: ^2.3.1
  sqflite: ^2.4.2
  http: ^1.5.0
  file_picker: ^8.1.2
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#FDF5EF"
  image: assets/logos/trade3/trade3_logo_on_light.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FDF5EF"
    image: assets/logos/trade3/trade3_icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logos/trade3/trade3_icon_flat.png
  adaptive_icon_background: "#FDF5EF"
  adaptive_icon_foreground: assets/logos/trade3/trade3_icon_foreground.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/logos/trade3/
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
